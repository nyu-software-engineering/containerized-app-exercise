services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web-app:
    build: ./web-app
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/tactile
    depends_on:
      - mongodb

  machine-learning-client:
    build: ./machine-learning-client
    environment:
      MONGO_URI: mongodb://mongodb:27017/tactile
    depends_on:
      - mongodb

volumes:
  mongo_data:
