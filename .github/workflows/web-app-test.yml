name: web-app-test

on:
  push:
    branches: [main]
    paths:
      - "web-app/**"
      - ".github/workflows/web-app-test.yml"
  pull_request:
    paths:
      - "web-app/**"
      - ".github/workflows/web-app-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          pipenv sync --dev --python $(which python)
      - name: Test
        run: pipenv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80