
services:
  web-app:
    build: ./web-app
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      ML_CLIENT_URL: http://ml-client:5000/predict
    depends_on:
      - ml-client
    restart: unless-stopped

  ml-client:
    build: ./machine-learning-client
    expose:
      - "5000"
    restart: unless-stopped
