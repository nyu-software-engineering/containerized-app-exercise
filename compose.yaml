
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-app:
    build: ./web-app
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/app
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - full

  ml-client:
    build: ./machine-learning-client
    environment:
      MONGO_URI: mongodb://mongodb:27017/app
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - full

volumes:
  mongo_data:
